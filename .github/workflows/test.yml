name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Install package
        run: pip install -e ".[dev]" hypothesis
      - name: Run tests
        run: pytest -q
