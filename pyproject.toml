[project]
name = "evilbox"
version = "0.1.0"
description = "Evilbox: static JavaScript and PHP deobfuscator (CLI and web UI)"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-php>=0.23",
    "jsbeautifier>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evilbox = "evilbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evilbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
